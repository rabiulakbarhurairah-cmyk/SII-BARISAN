<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitor Satker - SI-BARISAN</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .mhead {
        position: sticky;
        top: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 0.8rem;
        padding: 0.8rem 1rem;
        background: var(--ft);
        color: #fff;
        border-bottom: 3px solid var(--c);
      }
      .mhead > .button {
        justify-self: start;
      }
      .mlogo {
        justify-self: center;
      }
      .mright {
        justify-self: end;
      }
      /* Logo berkilau */
      .mlogo {
        position: relative;
        display: inline-block;
        overflow: hidden;
        line-height: 0;
        border-radius: 0.3rem;
      }
      .mlogo img {
        display: block;
        height: 2.6rem;
        width: auto;
      }
      .mlogo::after {
        content: "";
        position: absolute;
        top: 0;
        left: -80%;
        width: 50%;
        height: 100%;
        background: linear-gradient(
          100deg,
          transparent 0%,
          rgba(255, 255, 255, 0.85) 50%,
          transparent 100%
        );
        transform: skewX(-20deg);
        animation: kilau 4s ease-in-out infinite;
      }
      @keyframes kilau {
        0% {
          left: -80%;
        }
        30%,
        100% {
          left: 140%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mlogo::after {
          animation: none;
          display: none;
        }
      }
      #mwho {
        font-size: 0.78rem;
        opacity: 0.9;
      }
      .mright {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }
      #laporan.section {
        padding-top: 2rem;
      }

      /* Dropdown pilihan jenis satuan kerja (kanan atas, sejajar tombol Excel) */
      .tools .filt-sel {
        margin-left: auto;
        display: block;
      }
      .tools .filt-sel + .filt-sel {
        margin-left: 0;
      }
      .filt-sel select {
        min-width: 13rem;
        padding: 0.7rem 2.2rem 0.7rem 1rem;
        border: 2px solid var(--c);
        border-radius: 0.5rem;
        background-color: var(--bg);
        color: var(--t);
        font: 600 0.8rem inherit;
        font-family: inherit;
        cursor: pointer;
      }
      .filt-sel select option {
        background: var(--bg);
        color: var(--t);
      }

      /* Banner gambar bergulir */
      .banner {
        position: relative;
        width: calc(100% - 2rem);
        max-width: 1200px;
        margin: 1.2rem auto 0;
        border-radius: 1rem;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      }
      .banner__track {
        display: flex;
        transition: transform 0.6s ease;
      }
      .banner__slide {
        min-width: 100%;
      }
      .banner__slide img {
        display: block;
        width: 100%;
        aspect-ratio: 6 / 1;
        object-fit: cover;
      }
      .banner__btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 2.4rem;
        height: 2.4rem;
        border: 0;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 1.3rem;
        line-height: 1;
        cursor: pointer;
      }
      .banner__btn:hover {
        background: rgba(0, 0, 0, 0.7);
      }
      .banner__prev {
        left: 0.8rem;
      }
      .banner__next {
        right: 0.8rem;
      }
      .banner__dots {
        position: absolute;
        bottom: 0.6rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 0.4rem;
      }
      .banner__dots button {
        width: 0.6rem;
        height: 0.6rem;
        padding: 0;
        border: 0;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.8);
        cursor: pointer;
        transition: width 0.3s;
      }
      .banner__dots button.on {
        width: 2rem;
        background: var(--c);
      }
      @media (max-width: 640px) {
        .banner__slide img {
          aspect-ratio: 3 / 1;
        }
        .banner__btn {
          width: 2rem;
          height: 2rem;
        }
      }

      /* Ringkasan di atas tabel */
      .ringkas {
        margin: 0 0 0.6rem;
        font-size: 0.82rem;
        color: var(--t2);
      }

      /* Tabel lebih rapi */
      .tw {
        max-height: 70vh;
        overflow: auto;
        border-radius: 0.6rem;
      }
      #laporan th {
        position: sticky;
        top: 0;
        z-index: 1;
        white-space: nowrap;
      }
      #laporan td {
        vertical-align: middle;
      }
      #laporan tbody tr:nth-child(even) {
        background: rgba(128, 128, 128, 0.08);
      }
      #laporan tbody tr:hover {
        background: rgba(197, 217, 45, 0.2);
      }
      #laporan th:nth-child(3),
      #laporan td:nth-child(3),
      #laporan th:nth-child(n + 5),
      #laporan td:nth-child(n + 5) {
        text-align: center;
      }
      @media (max-width: 640px) {
        .tools .filt-sel {
          margin-left: 0;
          width: 100%;
        }
        .filt-sel select {
          width: 100%;
        }
      }
    </style>
    <link rel="stylesheet" href="glass.css" />
    <link rel="stylesheet" href="monitor-glass.css" />
  </head>
  <body>
    <header class="mhead">
      <a class="button line" href="index.html#laporan"
        >&larr; Kembali ke aplikasi</a
      >
      <span class="mlogo"
        ><img src="assets/img/LOGO MONITOR.jpg" alt="SI-BARISAN"
      /></span>
      <div class="mright">
        <span id="mwho"></span>
        <button class="button line" id="mtema" type="button">Mode gelap</button>
      </div>
    </header>

    <main>
      <div class="banner" id="banner" aria-label="Banner informasi">
        <div class="banner__track">
          <div class="banner__slide">
            <img src="assets/img/GAMBAR PANJANG1.jpg" alt="Banner 1" />
          </div>
          <div class="banner__slide">
            <img src="assets/img/PANJANG1.png" alt="Banner 2" />
          </div>
          <div class="banner__slide">
            <img src="assets/img/PANJANG2.png" alt="Banner 3" />
          </div>
        </div>
        <button
          class="banner__btn banner__prev"
          type="button"
          aria-label="Sebelumnya"
        >
          &#10094;
        </button>
        <button
          class="banner__btn banner__next"
          type="button"
          aria-label="Berikutnya"
        >
          &#10095;
        </button>
        <div class="banner__dots"></div>
      </div>
      <section class="section" id="laporan">
        <h2 class="section__title">Monitor Satker</h2>
        <div class="container">
          <div class="tbox">
            <div class="pita-sulapa" aria-hidden="true"></div>
            <div class="tools">
              <button class="button line" id="csv" type="button">
                Unduh Excel
              </button>
              <button class="button line" id="muat" type="button">
                Muat ulang
              </button>
              <label class="filt-sel">
                <select id="kabf" aria-label="Pilih kabupaten/kota">
                  <option value="Semua">Semua kabupaten/kota</option>
                </select>
              </label>
              <label class="filt-sel">
                <select id="filt" aria-label="Pilih jenis satuan kerja">
                  <option value="Semua">Semua jenis</option>
                  <option value="Kanwil">Kanwil</option>
                  <option value="Kankemenag">Kankemenag</option>
                  <option value="KUA">KUA</option>
                  <option value="MIN">MIN</option>
                  <option value="MTsN">MTsN</option>
                  <option value="MAN">MAN</option>
                </select>
              </label>
            </div>
            <p class="drive-note" id="info" role="status"></p>
            <p class="ringkas" id="ringkas" aria-live="polite"></p>
            <div class="tw">
              <table>
                <thead>
                  <tr>
                    <th>Tanggal</th>
                    <th>Satuan kerja</th>
                    <th>Jalur</th>
                    <th>Kab/Kota</th>
                    <th>NB</th>
                    <th>NS</th>
                    <th>NK</th>
                    <th>NT</th>
                    <th>IGBS</th>
                    <th>Kategori</th>
                    <th>Drive</th>
                  </tr>
                </thead>
                <tbody id="tb"></tbody>
              </table>
            </div>
            <p class="empty" id="em">Belum ada penilaian.</p>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script src="wilayah.js"></script>
    <script src="monitor.js"></script>
    <script>
      (function () {
        var b = document.querySelector("#banner");
        if (!b) return;

        var tr = b.querySelector(".banner__track"),
          dots = b.querySelector(".banner__dots"),
          n = tr.children.length,
          i = 0,
          tm,
          x0 = null;

        // Buat titik navigasi
        for (var k = 0; k < n; k++) {
          var d = document.createElement("button");
          d.type = "button";
          d.setAttribute("aria-label", "Gambar " + (k + 1));
          d.dataset.i = k;
          dots.appendChild(d);
        }

        function go(k) {
          i = (k + n) % n;
          tr.style.transform = "translateX(-" + i * 100 + "%)";
          [].forEach.call(dots.children, function (d, j) {
            d.className = j === i ? "on" : "";
          });
        }

        function play() {
          clearInterval(tm);
          if (n > 1)
            tm = setInterval(function () {
              go(i + 1);
            }, 4000);
        }

        b.querySelector(".banner__prev").onclick = function () {
          go(i - 1);
          play();
        };
        b.querySelector(".banner__next").onclick = function () {
          go(i + 1);
          play();
        };

        dots.onclick = function (e) {
          if (e.target.dataset.i !== undefined) {
            go(+e.target.dataset.i);
            play();
          }
        };

        b.onmouseenter = function () {
          clearInterval(tm);
        };
        b.onmouseleave = play;

        b.addEventListener(
          "touchstart",
          function (e) {
            x0 = e.touches[0].clientX;
          },
          { passive: true },
        );

        b.addEventListener("touchend", function (e) {
          if (x0 === null) return;
          var dx = e.changedTouches[0].clientX - x0;
          if (Math.abs(dx) > 40) {
            go(i + (dx < 0 ? 1 : -1));
            play();
          }
          x0 = null;
        });

        go(0);
        play();
      })();
    </script>
    <script src="monitor-glass.js"></script>
    <script src="select-glass.js"></script>
  </body>
</html>
